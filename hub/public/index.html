<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero on an iPhone; without it the
         notch / home-indicator padding in hub.css silently does nothing. -->

    <title>Harness Remote Hub</title>
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HR Hub" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="stylesheet" href="hub.css" />
  </head>
  <body>
    <div id="app" class="app" aria-live="polite"></div>
    <noscript><p class="noscript">The Harness Remote Hub console needs JavaScript.</p></noscript>
    <script type="module" src="app.js"></script>
  </body>
</html>
