name: PR checks

# This workflow is intended to become the required pre-merge gate for main. It must therefore
# exist for every pull request: a workflow-level paths filter can make required status contexts
# disappear entirely on docs-only or otherwise out-of-scope PRs, leaving those PRs unmergeable.
# Keep the gate universal first; optimize heavy jobs with always-present path-aware logic only after
# branch protection is enforced and the required-context contract is stable.

"on":
  workflow_dispatch: {}
  pull_request: {}

permissions:
  contents: read

# A pull request that is pushed to twice in a minute does not need the first Android build to
# finish: it takes the longest and its APK is already stale.
concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Type-check and regressions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Type-check and build web app
        run: npm run build
        working-directory: web

      - name: Run web regression tests
        run: npm run test:ci:full
        working-directory: web

      - name: Run OpenCode permission transport regression
        run: node scripts/run-vite-test.mjs src/opencode-permission-api.test.mjs
        working-directory: web

      - name: Run bridge tests
        run: npm test
        working-directory: bridge

  bridge-platforms:
    name: Bridge tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Run bridge tests
        run: npm test
        working-directory: bridge

  # Source-level assertions are useful but cannot tell us whether a control is actually clipped or
  # whether real browser state produces duplicate turns. The browser gate therefore drives the
  # production build and waits on explicit product/UI state; persistent live event streams are not
  # treated as page-readiness signals.
  browser-smoke:
    name: Chromium product smoke
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build production web app
        run: npm run build
        working-directory: web

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
        working-directory: web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web

      - name: Run portrait landscape and multi-machine smoke
        run: node scripts/v3-browser-smoke.mjs
        working-directory: web

      - name: Run native Session transcript and composer smoke
        run: |
          node scripts/native-session-navigation-smoke.mjs
          node scripts/native-claude-browser-smoke.mjs
          node scripts/native-session-reconnect-smoke.mjs
          node scripts/native-session-browser-smoke.mjs
          node scripts/native-opencode-browser-smoke.mjs
          node scripts/native-opencode-real-regression-smoke.mjs
          node scripts/native-opencode-permission-regression-smoke.mjs
          node scripts/native-opencode-rail-state-smoke.mjs
          node scripts/native-opencode-retry-error-smoke.mjs
          node scripts/native-opencode-unmounted-durable-smoke.mjs
          node scripts/native-opencode-multiturn-stress-smoke.mjs
          node scripts/native-session-model-switch-smoke.mjs
          node scripts/native-session-outcome-browser-smoke.mjs
        working-directory: web

      - name: Run cross-machine continuation safety smoke
        run: node scripts/cross-machine-continuation-browser-smoke.mjs
        working-directory: web

      - name: Run complete controls and screenshot smoke
        run: node scripts/v3-browser-controls-smoke.mjs
        working-directory: web

      - name: Upload browser audit screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v3-browser-audit-${{ github.event.pull_request.head.sha || github.sha }}
          path: web/browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

  # The hub is a separate deployable with its own tests. Its integration suites need a real Postgres (and,
  # for the client round-trip, a real Loki); `ci-guard.test.js` fails the job if the database is missing,
  # so a misconfigured service container can never turn this into a silent pass.
  hub:
    name: Hub tests (Postgres + Loki)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUB_TEST_DATABASE_URL: postgres://hub:hub@127.0.0.1:5432/hub
      HUB_TEST_LOKI_URL: http://127.0.0.1:3100
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - name: Install hub dependencies
        run: npm ci
        working-directory: hub

      # Same image and config the compose stack ships, so the client is proven against the real thing.
      - name: Start Loki
        run: |
          docker run -d --name loki -p 3100:3100 \
            -v "$GITHUB_WORKSPACE/deploy/loki/loki-config.yml:/etc/loki/config.yml:ro" \
            grafana/loki:3.4.2 -config.file=/etc/loki/config.yml
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3100/ready | grep -q ready && exit 0
            sleep 2
          done
          docker logs loki
          exit 1

      - name: Run hub tests
        run: npm test
        working-directory: hub

  # Drives the hub console and the real built web app in Chromium with an iPhone profile. This is
  # emulation (Chromium's engine, Apple's viewport/touch/user agent), not Safari: it catches layout,
  # sizing, CSP and script errors and proves the sign-in -> hub machines -> proxy path, not WebKit quirks.
  hub-browser:
    name: Hub console and app on an iPhone profile
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HUB_TEST_DATABASE_URL: postgres://hub:hub@127.0.0.1:5432/hub
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            hub/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build the web app the hub serves
        run: npm run build
        working-directory: web

      - name: Install hub dependencies
        run: npm ci
        working-directory: hub

      - name: Install pinned Playwright runtime
        run: npm install --no-save --package-lock=false playwright@1.55.0
        working-directory: hub

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: hub

      - name: Run hub console smoke (iPhone, landscape, dark, desktop)
        run: node scripts/ui-smoke.mjs
        working-directory: hub

      - name: Run app-through-hub smoke (sign-in, hub machines, proxy, keyboard, service worker)
        run: node scripts/app-smoke.mjs
        working-directory: hub

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hub-browser-${{ github.event.pull_request.head.sha || github.sha }}
          path: hub/browser-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14

  # The whole product as a user runs it: `docker compose up`, then a REAL machine daemon pointed at it
  # with one command. Includes the Grafana profile and the Caddy TLS profile.
  hub-stack:
    name: Hub stack end-to-end (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate a private .env (the same command a user runs for HTTPS)
        run: sh deploy/init-env.sh --domain localhost > /dev/null

      - name: Build the hub image
        run: docker compose --profile grafana --profile tls build

      - name: Start the stack
        run: docker compose --profile grafana --profile tls up -d --wait --wait-timeout 240

      - name: Run end-to-end checks
        run: node hub/scripts/e2e-stack.mjs
        env:
          E2E_GRAFANA: "1"
          HUB_TLS_URL: https://localhost

      - name: Show container logs on failure
        if: failure()
        run: docker compose --profile grafana --profile tls logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose --profile grafana --profile tls down -v

  apk:
    name: Debug APK
    needs: [tests, bridge-platforms, browser-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Build web app
        run: npm run build
        working-directory: web

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # setup-android@v4 still defaults to the retired `tools` package. We install the exact
          # platform/build-tools below, so skip that default package set and keep the gate reproducible.
          packages: ''

      - name: Install Android 36 SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Add Capacitor Android platform
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
        working-directory: web

      - name: Generate Android app icon assets
        continue-on-error: true
        run: npx @capacitor/assets generate --android --assetPath public --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF'
        working-directory: web

      - name: Sync Capacitor project
        run: npm run cap:sync:android
        working-directory: web

      - name: Read app version
        id: version
        run: |
          APP_VERSION=$(node -p "require('./web/package.json').version")
          VERSION_CODE=$(node -e "const [major, minor, patch] = process.argv[1].split('.').map(Number); console.log((major * 10000) + (minor * 100) + patch)" "$APP_VERSION")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Sync Android version metadata
        run: node web/scripts/sync-android-version.mjs "${{ steps.version.outputs.app_version }}" "${{ steps.version.outputs.version_code }}"

      - name: Give the debug build its own application id
        run: node web/scripts/set-debug-app-id.mjs

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        working-directory: web/android

      - name: Verify debug APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose web/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Name the artifact after the commit it was built from
        id: build
        run: echo "sha=$(git rev-parse --short "${{ github.event.pull_request.head.sha || github.sha }}")" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: harness-remote-debug-v${{ steps.version.outputs.app_version }}-${{ steps.build.outputs.sha }}
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
